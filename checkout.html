<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Delight Treats</title>
  <meta name="description" content="Complete your order for delicious homemade treats.">
  <meta name="author" content="Delight Treats">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-900">
  <div id="header"></div>

  <main class="py-16 md:py-20">
    <div class="mx-auto w-full max-w-2xl px-4">
      <h1 class="mb-8 text-center font-bold text-3xl">Checkout</h1>

      <form id="checkout-form" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium">Full Name</label>
          <input type="text" id="name" name="name" required
                 class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input type="email" id="email" name="email" required
                 class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium">Phone</label>
          <input type="tel" id="phone" name="phone" required
                 class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <div>
          <label for="address" class="block text-sm font-medium">Delivery Address</label>
          <textarea id="address" name="address" rows="3" required
                    class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2"></textarea>
        </div>

        <div>
          <label for="delivery-date" class="block text-sm font-medium">Delivery Date</label>
          <input type="date" id="delivery-date" name="delivery-date" required
                 class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2">
        </div>

        <button type="submit"
                class="w-full rounded-md bg-pink-500 px-4 py-3 text-white hover:bg-pink-600">
          Place Order
        </button>
      </form>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
