<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart - Delight Treats</title>
  <meta name="description" content="Review your shopping cart and proceed to checkout.">
  <meta name="author" content="Delight Treats">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-gray-900">
  <div id="header"></div>

  <main class="py-16 md:py-20">
    <div class="mx-auto w-full max-w-4xl px-4">
      <h1 class="mb-8 text-center font-bold text-3xl">Shopping Cart</h1>

      <div id="cart-items" class="space-y-4">
        <!-- Cart items will be loaded here -->
      </div>

      <div class="mt-8 flex justify-between items-center">
        <div class="text-xl font-bold">
          Total: <span id="cart-total">$0.00</span>
        </div>
        <a href="checkout.html" class="rounded-md bg-pink-500 px-6 py-3 text-white hover:bg-pink-600">
          Proceed to Checkout
        </a>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
