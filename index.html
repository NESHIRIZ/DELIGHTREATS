<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delight Treats - Delicious Homemade Desserts</title>
  <meta name="description" content="Freshly baked homemade treats like cakes, cupcakes, cookies, and other desserts for every sweet occasion.">
  <meta name="author" content="Delight Treats">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-cream-50 text-gray-900">
  <div id="header"></div>

  <main>
    <!-- Hero Section -->
    <section class="relative overflow-hidden bg-gradient-to-br from-pink-100 via-cream-50 to-brown-50 text-gray-900">
      <div class="mx-auto w-full max-w-6xl px-4">
        <div class="relative z-10 py-24 text-center md:py-28">
          <h1 class="mx-auto mt-6 max-w-3xl text-4xl font-bold leading-tight md:text-6xl animate-fade-in">
            Delight Treats
          </h1>
          <p class="mx-auto mt-6 max-w-2xl text-base leading-relaxed text-gray-700 md:text-lg">
            Delicious homemade treats like cakes, cupcakes, cookies, and other desserts for every sweet occasion.
          </p>
          <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
            <a
              href="products.html"
              class="inline-flex h-12 items-center justify-center rounded-full bg-pink-500 px-8 text-sm font-semibold text-white shadow-lg transition hover:bg-pink-600 animate-bounce"
            >
              Shop Now
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Products Section -->
    <section class="border-b border-gray-200/50 bg-white py-16 md:py-20">
      <div class="mx-auto w-full max-w-6xl px-4">
        <div class="mx-auto mb-8 max-w-4xl text-center">
          <h2 class="font-bold text-3xl leading-tight md:text-4xl">
            Our Products
          </h2>
          <p class="mt-4 text-base text-gray-600 md:text-lg">
            Freshly baked treats made with love
          </p>
        </div>
        <div id="featured-products" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
          <!-- Products will be loaded here -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
